name: Nightly

# The matrix of D11 and Thread Sanitizer: the newest simulator runtime and the oldest one Xcode 26.6
# can install, and the core tests under TSan. On demand only, never per pull request: the daily
# schedule was removed on 2026-10-14 because macOS minutes count ten times against the
# organisation's Free plan quota (plan section 15). Run it from the Actions tab before a release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  thread-sanitizer:
    name: core tests under TSan
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The stress suite (plan section 5) runs here and on demand, not per pull request.
      - run: swift test --sanitize=thread
        env:
          RUBICON_STRESS: "1"

  release-configuration:
    name: core tests in the release configuration
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The optimizer on and `defaultDebug` false: the other half of iOS Configuration 2.
      - run: swift test -c release -Xswiftc -enable-testing

  simulator-matrix:
    name: simulator ${{ matrix.runtime }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: newest
          - runtime: oldest
            ios: "15"
            download: "15.5"
    steps:
      - uses: actions/checkout@v4
      - if: matrix.download != ''
        # Installs the oldest runtime the release toolchain supports (iOS Public API 2). Verified on
        # the first nightly run; see plan section 15.
        run: xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.download }}
      - run: xcrun simctl list runtimes
      - run: Scripts/test-simulator.sh ${{ matrix.ios }}
