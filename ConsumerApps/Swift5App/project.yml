# XcodeGen spec (D10); the .xcodeproj is generated, never committed.
name: Swift5App
options:
  bundleIdPrefix: com.rubicon.analytics.consumer
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
packages:
  Rubicon:
    path: ../..
targets:
  Swift5App:
    type: application
    platform: iOS
    sources: [Sources, ../Shared/App]
    dependencies:
      - package: Rubicon
        product: Rubicon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        # The scene lifecycle is mandatory for apps built with the iOS 27 SDK.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # The UI test runner's server listens on 127.0.0.1; plain HTTP to it is local networking.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rubicon.analytics.consumer.swift5app
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
  Swift5AppUITests:
    type: bundle.ui-testing
    platform: iOS
    # XCUIAutomation links for iOS 17; the app under test keeps the iOS 15 floor.
    deploymentTarget: "17.0"
    sources: [../Shared/UITests]
    dependencies:
      - target: Swift5App
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
schemes:
  Swift5App:
    build:
      targets:
        Swift5App: all
        Swift5AppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [Swift5AppUITests]
